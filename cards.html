<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2520" />
    <title>卡册 · 咻噗-奥灵宠图鉴</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/cards.css?v=mwa3t6s0" />
  </head>
  <body>
    <header class="top">
      <a href="/">← 返回图鉴</a>
      <div>
        <h1>卡册</h1>
        <p>77 张灵宠卡 · 每页 9 张</p>
      </div>
    </header>

    <main class="wrap">
      <section class="tools">
        <div class="search-row">
          <input id="cardSearch" type="search" placeholder="搜索灵宠名字…" autocomplete="off" />
          <button id="cardFilterBtn" type="button" class="filter-btn">分类 <b id="filterCount">全部</b></button>
        </div>
        <div class="filter-panel hidden" id="filterPanel">
          <div class="filter-group">
            <span class="filter-label">阶段</span>
            <div class="chips" id="stageChips"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">属性</span>
            <div class="chips" id="elemChips"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">稀有度</span>
            <div class="chips" id="rarityChips"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">战斗力</span>
            <div class="chips" id="powerChips"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">收藏</span>
            <div class="chips"><button type="button" class="chip fav-chip" id="favChip">☆ 只看收藏</button></div>
          </div>
        </div>
      </section>

      <section class="grid" id="cardGrid"></section>

      <div class="empty hidden" id="cardEmpty">没有符合条件的卡牌</div>

      <nav class="pager" id="cardPager"></nav>
      <p class="count" id="cardCount"></p>
    </main>

    <div class="viewer hidden" id="cardViewer">
      <button class="viewer-close" id="viewerClose" type="button">×</button>
      <img id="viewerImg" alt="" />
      <div class="viewer-cap" id="viewerCap"></div>
    </div>

    <script src="/cards.js?v=mwa3t6s0" defer></script>
  </body>
</html>
