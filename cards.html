<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2520" />
    <title>卡册 · 咻噗-奥灵宠图鉴</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/cards.css?v=mwbq40v7" />
  </head>
  <body>
    <header class="top">
      <a href="/" class="back">←</a>
      <div class="title">
        <h1>卡册</h1>
        <p id="cardCount">77 张 · 每页 9 张</p>
      </div>
      <button id="favTag" type="button" class="fav-tag">★ 收藏 0</button>
    </header>

    <main class="wrap">
      <nav class="book-tabs" id="bookTabs">
        <button class="book-tab on" data-book="normal" type="button">普通卡册</button>
        <button class="book-tab" data-book="ur" type="button">UR 卡册</button>
      </nav>

      <section class="tools">
        <input id="cardSearch" type="search" placeholder="搜索灵宠名字…" autocomplete="off" />
        <button id="cardSortBtn" type="button" class="tool-btn">编号 ↑</button>
        <button id="cardFilterBtn" type="button" class="tool-btn">分类 <b id="filterCount">全部</b></button>
      </section>

      <div class="filter-panel hidden" id="filterPanel">
        <div class="filter-group">
          <span class="filter-label">阶段</span>
          <div class="chips" id="stageChips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">属性</span>
          <div class="chips" id="elemChips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">稀有度</span>
          <div class="chips" id="rarityChips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">战斗力</span>
          <div class="chips" id="powerChips"></div>
        </div>
      </div>

      <section class="book">
        <button class="page-arrow" id="prevPage" type="button" title="上一页">‹</button>
        <section class="grid" id="cardGrid"></section>
        <button class="page-arrow" id="nextPage" type="button" title="下一页">›</button>
      </section>

      <div class="empty hidden" id="cardEmpty">没有符合条件的卡牌</div>

      <nav class="pager" id="cardPager"></nav>
    </main>

    <div class="viewer hidden" id="cardViewer">
      <button class="viewer-close" id="viewerClose" type="button">×</button>
      <img id="viewerImg" alt="" />
      <div class="viewer-cap" id="viewerCap"></div>
    </div>

    <script src="/cards.js?v=mwbq40v7" defer></script>
  </body>
</html>
