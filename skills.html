<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2520" />
    <meta name="description" content="咻噗·奥灵宠图鉴 · 技能池：按分类与属性检索全部技能，标注需要技能书解锁的招式。" />
    <title>技能池 · 咻噗-奥灵宠图鉴</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="stylesheet" href="/skills.css?v=mwcyk4jq" />
  </head>
  <body>
    <header class="sp-top">
      <a class="sp-back" href="/">← 返回图鉴</a>
      <img class="sp-logo" src="/media/ui/ui-skillpool.webp" alt="" />
      <h1>技能池</h1>
      <span class="sp-count" id="count">加载中…</span>
    </header>

    <main class="sp-wrap">
      <div class="sp-tabs">
        <button class="sp-tab on" id="tabList">技能列表</button>
        <button class="sp-tab" id="tabBooks">技能书图鉴</button>
      </div>
      <div id="bookView" hidden>
        <div class="book-grid" id="bookGrid"></div>
      </div>
      <section class="sp-filters">
        <div class="sp-row">
          <span class="sp-label">分类</span>
          <div class="sp-chips" id="fCat"></div>
        </div>
        <div class="sp-row">
          <span class="sp-label">属性</span>
          <div class="sp-chips" id="fElem"></div>
        </div>
        <div class="sp-row">
          <span class="sp-label">解锁</span>
          <div class="sp-chips" id="fBook"></div>
        </div>
        <div class="sp-row">
          <input id="q" class="sp-search" placeholder="搜索技能名 / 描述 / 灵宠" />
          <select id="sort" class="sp-sort">
            <option value="power">按威力降序</option>
            <option value="name">按名称</option>
            <option value="pp">按 PP</option>
          </select>
        </div>
      </section>

      <details class="usage-box">
        <summary>图鉴关联解锁（用某只灵宠出战 10 次，自动解锁它的专属技能书）</summary>
        <div id="usagePanel"></div>
      </details>

      <div class="sp-grid" id="grid"></div>
      <div class="pager" id="pager"></div>
      <p class="sp-empty" id="empty" hidden>没有符合条件的技能。</p>
    </main>

    <script src="/skills.js?v=mwcyk4jq"></script>
  </body>
</html>
