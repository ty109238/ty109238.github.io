<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2520" />
    <meta name="robots" content="noindex, nofollow" />
    <title>作者编辑台 · 奥灵宠图鉴</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" crossorigin href="/assets/index-C7tQ-E0c.css" />
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body class="ed-body">
    <section id="gate" class="ed-gate" hidden>
      <form id="gateForm" class="ed-gate-card">
        <h1>作者编辑台</h1>
        <p id="gateTip">只有作者本人可以修改图鉴内容。请输入访问密码。</p>
        <label class="ed-field">
          <span id="gateLabel">访问密码</span>
          <input id="gatePass" type="password" autocomplete="current-password" required />
        </label>
        <label class="ed-field" id="gatePass2Wrap" hidden>
          <span>再输入一次</span>
          <input id="gatePass2" type="password" autocomplete="new-password" />
        </label>
        <button class="ed-btn primary" style="width:100%" type="submit" id="gateSubmit">进入编辑台</button>
        <p class="ed-hint-inline">密码只保存在这台设备上，用于挡住误入的访客；真正决定「谁能改线上内容」的是发布密钥（GitHub Token）。</p>
      </form>
    </section>

    <div id="app" hidden>
      <header class="ed-top">
        <div class="ed-brand">
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#2a2520"/><path d="M32 8 52 16v16c0 13-8 21-20 25C20 53 12 45 12 32V16Z" fill="none" stroke="#e7bd55" stroke-width="4"/><path d="M22 34c12-1 18-7 20-16 4 15-2 25-18 28" fill="none" stroke="#e7bd55" stroke-width="4" stroke-linecap="round"/></svg>
          <span>奥灵宠图鉴</span>
          <small>编辑台</small>
        </div>
        <div class="ed-status">
          <span class="ed-dot" id="statusDot"></span>
          <span id="statusText">就绪</span>
        </div>
        <div class="ed-tools">
          <a class="ed-btn small" href="/" target="_blank" rel="noopener">打开图鉴</a>
          <button class="ed-btn small" id="btnSave" type="button">保存草稿</button>
          <button class="ed-btn small" id="btnExport" type="button">导出备份</button>
          <button class="ed-btn small" id="btnImport" type="button">导入备份</button>
          <button class="ed-btn small primary" id="btnPublish" type="button">发布到线上</button>
          <button class="ed-btn small" id="btnFamilies" type="button">家族简介</button>
          <button class="ed-btn small" id="btnSettings" type="button">设置</button>
        </div>
      </header>

      <div class="ed-main">
        <aside class="ed-side">
          <div class="ed-search">
            <input id="search" type="text" placeholder="搜索名称 / 家族…" autocomplete="off" />
          </div>
          <div class="ed-list" id="list"></div>
          <div class="ed-side-foot">
            <button class="ed-btn small" id="btnNew" type="button" style="width:100%">＋ 新建灵宠</button>
          </div>
        </aside>
        <section class="ed-pane" id="pane">
          <div class="ed-empty">从左侧选择一只灵宠开始编辑</div>
        </section>
      </div>
    </div>

    <div class="ed-modal" id="modal" hidden>
      <div class="ed-modal-card" id="modalCard"></div>
    </div>

    <div class="ed-toast" id="toast" hidden></div>

    <input type="file" id="filePicker" accept="image/*" hidden />

    <script src="/editor.js"></script>
  </body>
</html>
