<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2520" />
    <meta name="description" content="咻噗·奥灵宠图鉴 · 战斗模拟器：六对六回合制对战，自由配队、分配学习力、挑选技能。" />
    <title>战斗模拟器 · 咻噗-奥灵宠图鉴</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="stylesheet" href="/battle.css?v=mw4qfel9" />
  </head>
  <body>
    <header class="top">
      <a class="back" href="/">← 返回图鉴</a>
      <h1>战斗模拟器</h1>
      <span class="step" id="step">第 1 步 · 组队</span>
    </header>

    <main class="wrap">
      <!-- 建队 -->
      <section id="buildView">
        <p class="sub" id="recordLine" style="margin:0 0 12px;font-size:13px;color:#55677b"></p>
        <div class="build-grid">
          <div class="team-col" id="myCol">
            <div class="team-head">
              <h2>我方队伍</h2>
              <span class="cnt" id="myCount">0 / 6</span>
              <button class="mini" id="myRandom"><img class="btn-ico" src="/media/ui/fn-btn-normal.webp" alt="">随机填满</button>
            </div>
            <div class="slots" id="mySlots"></div>
          </div>
          <div class="team-col enemy" id="enemyCol">
            <div class="team-head">
              <h2>敌方队伍</h2>
              <span class="cnt" id="enemyCount">0 / 6</span>
              <button class="mini" id="enemyRandom"><img class="btn-ico" src="/media/ui/fn-btn-mid.webp" alt="">随机填满</button>
            </div>
            <div class="slots" id="enemySlots"></div>
          </div>
        </div>
        <div class="mode-row">
          <span class="mode-title">对战模式</span>
          <button type="button" class="mode-btn on" id="modeSingle">单打 1v1</button>
          <button type="button" class="mode-btn" id="modeDouble">双打 2v2</button>
          <span class="mode-now" id="modeLabel">单打（1v1）</span>
        </div>
        <div class="build-actions">
          <label class="field" style="flex:0 0 220px">
            <span>AI 难度</span>
            <select id="aiLevel">
              <option value="easy">简单（随机出招）</option>
              <option value="normal" selected>普通（会算伤害）</option>
              <option value="hard">困难（最优解，不随机）</option>
            </select>
          </label>
          <button class="big-btn ghost" id="clearAll">清空</button>
          <button class="big-btn" id="startBattle" disabled><img class="btn-ico" src="/media/ui/fn-arena.webp" alt="">开始对战</button>
        </div>
      </section>

      <!-- 战斗 -->
      <section id="battleView" class="hidden">
        <div class="round-badge" id="roundBadge">第 1 回合</div>
        <div class="weather-badge" id="weatherBadge"></div>
        <div class="field-bar" id="fieldBar"></div>
        <div class="battle-hud">
          <div>
            <div class="side-team" id="enemyRow"></div>
          </div>
          <div>
            <div class="active-mon" id="enemyActive"></div>
          </div>
          <div>
            <div class="active-mon" id="myActive"></div>
          </div>
        </div>
        <div class="log" id="log"></div>
        <div class="side-team" id="myRow" style="margin:0 0 10px"></div>
        <div class="actions">
          <div class="skill-bar" id="skillBar"></div>
          <div class="switch-bar" id="switchBar"></div>
        </div>
        <div class="build-actions">
          <button class="big-btn ghost" id="giveUp"><img class="btn-ico" src="/media/ui/fn-potion.webp" alt="">认输并重来</button>
        </div>
      </section>

      <!-- 双打 -->
      <section id="dblView" class="hidden">
        <div class="field-bar" id="fieldBar"></div>
        <div class="weather-badge" id="dblWeather"></div>
        <div class="dbl-grid">
          <div class="dbl-side"><div class="dbl-side-title">敌方</div><div class="dbl-cards" id="dblEnemy"></div></div>
          <div class="dbl-side"><div class="dbl-side-title">我方</div><div class="dbl-cards" id="dblMine"></div></div>
        </div>
        <div class="log" id="log2" style="height:190px"></div>
        <div class="dbl-actions" id="dblActions"></div>
        <div class="switch-bar" id="dblSwitch" style="margin-top:10px"></div>
        <div class="build-actions">
          <button class="big-btn ghost" id="dblGiveUp">认输并重来</button>
          <button class="big-btn" id="dblConfirm"><img class="btn-ico" src="/media/ui/fn-arena.webp" alt="">确认出手</button>
        </div>
      </section>

      <!-- 回放 -->
      <section id="replayView" class="hidden">
        <div class="active-mon" style="margin-bottom:12px">
          <h4 style="margin:0 0 6px">战斗回放</h4>
          <div class="tags" id="replayHead" style="text-align:left;line-height:1.8"></div>
          <div class="build-actions" style="margin-top:10px">
            <button class="big-btn ghost" id="replayNext">下一句</button>
            <button class="big-btn ghost" id="replayAll">全部展开</button>
            <span class="ev-left" id="replayPos" style="align-self:center"></span>
          </div>
        </div>
        <div class="log" id="replayLog" style="height:420px"></div>
        <div class="build-actions">
          <a class="big-btn" href="/battle.html" style="text-align:center;text-decoration:none;color:inherit">返回组队</a>
        </div>
      </section>

      <!-- 结算 -->
      <section id="resultView" class="hidden">
        <div class="result">
          <h2 id="resultTitle">对战结束</h2>
          <p id="resultSub" style="color:#7b8ea1"></p>
          <div id="replayArea" class="hidden" style="max-width:640px;margin:22px auto 0;text-align:left">
            <p class="sub" style="margin:0 0 6px;font-size:12.5px;color:#7b8ea1">回放码：复制发给别人，或下载 JSON 存档</p>
            <textarea id="replayBox" style="width:100%;height:88px;border:2px solid #dbe6f0;border-radius:10px;padding:8px;font-size:11px;font-family:monospace"></textarea>
            <div class="build-actions" style="margin-top:10px">
              <button class="big-btn ghost" id="copyReplay">复制回放码</button>
              <button class="big-btn ghost" id="downloadReplay">下载 JSON</button>
            </div>
          </div>
          <div class="build-actions" style="max-width:420px;margin:24px auto 0">
            <button class="big-btn" id="again"><img class="btn-ico" src="/media/ui/fn-btn-mid.webp" alt="">再来一局</button>
          </div>
        </div>
      </section>
    </main>

    <!-- 配置弹窗 -->
    <div class="modal" id="modal" hidden>
      <div class="mbox">
        <h3 id="mboxTitle">配置灵宠</h3>
        <p class="sub">选择灵宠，再调整等级 / 星级 / 天赋 / 阶段 / 性格 / 学习力 / 技能。</p>
        <div id="mboxBody"></div>
        <div class="build-actions">
          <button class="big-btn ghost" id="mboxCancel">取消</button>
          <button class="big-btn" id="mboxOk">确定</button>
        </div>
      </div>
    </div>

    <script src="/battle.js?v=97"></script>
  </body>
</html>
